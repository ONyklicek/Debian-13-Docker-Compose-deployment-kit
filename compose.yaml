name: ${COMPOSE_PROJECT_NAME:-laravel-erp}

x-app-env: &app-env
  APP_ENV: ${APP_ENV:-production}
  APP_DEBUG: ${APP_DEBUG:-false}
  APP_KEY: ${APP_KEY:?Set APP_KEY in secrets.env}
  APP_URL: https://${APP_DOMAIN:?Set APP_DOMAIN}
  LOG_CHANNEL: stderr
  LOG_LEVEL: info
  TZ: ${APP_TIMEZONE:-Europe/Prague}
  DB_CONNECTION: mysql
  DB_HOST: db
  DB_PORT: 3306
  DB_DATABASE: ${DB_NAME:-erp}
  DB_USERNAME: ${DB_USER:-erp_app}
  DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
  REDIS_CLIENT: phpredis
  REDIS_HOST: redis
  REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
  REDIS_PORT: 6379
  CACHE_STORE: redis
  SESSION_DRIVER: redis
  QUEUE_CONNECTION: redis
  BROADCAST_CONNECTION: reverb
  REVERB_APP_ID: ${REVERB_APP_ID:-erp-production}
  REVERB_APP_KEY: ${REVERB_APP_KEY:?Set REVERB_APP_KEY}
  REVERB_APP_SECRET: ${REVERB_APP_SECRET:?Set REVERB_APP_SECRET}
  REVERB_HOST: reverb
  REVERB_PORT: 8080
  REVERB_SCHEME: http
  VITE_REVERB_APP_KEY: ${REVERB_APP_KEY:?Set REVERB_APP_KEY}
  VITE_REVERB_HOST: ${APP_DOMAIN:?Set APP_DOMAIN}
  VITE_REVERB_PORT: 443
  VITE_REVERB_SCHEME: https

x-app-volumes: &app-volumes
  - ${APP_STORAGE_PATH:-/opt/laravel-erp/persistent/storage}:/var/www/html/storage
  - ${APP_PUBLIC_UPLOADS_PATH:-/opt/laravel-erp/persistent/public}:/var/www/html/public/uploads

services:
  traefik:
    image: traefik:v3.3
    restart: unless-stopped
    command:
      - --providers.file.filename=/etc/traefik/dynamic/active.yml
      - --providers.file.watch=true
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --certificatesresolvers.le.acme.email=${ACME_EMAIL:?Set ACME_EMAIL}
      - --certificatesresolvers.le.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.le.acme.httpchallenge=true
      - --certificatesresolvers.le.acme.httpchallenge.entrypoint=web
      - --accesslog=true
      - --log.level=INFO
      - --api.dashboard=false
      - --ping=true
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./traefik/dynamic:/etc/traefik/dynamic:ro
      - traefik_acme:/letsencrypt
    networks: [edge, internal]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 30s
      timeout: 5s
      retries: 3

  db:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_NAME:-erp}
      MARIADB_USER: ${DB_USER:-erp_app}
      MARIADB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD}
      TZ: ${APP_TIMEZONE:-Europe/Prague}
    volumes:
      - mariadb_data:/var/lib/mysql
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h 127.0.0.1 -uroot -p\"$${MARIADB_ROOT_PASSWORD}\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    security_opt: ["no-new-privileges:true"]
    stop_grace_period: 1m

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["sh", "-ec", "exec redis-server --appendonly yes --requirepass \"$${REDIS_PASSWORD}\""]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping 2>/dev/null | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    security_opt: ["no-new-privileges:true"]
    stop_grace_period: 30s

  app-blue:
    image: ${APP_IMAGE_BLUE:-laravel-erp:uninitialized-blue}
    build:
      context: ${APP_BUILD_CONTEXT:-/opt/laravel-erp/releases/uninitialized}
      dockerfile: /opt/laravel-erp/Dockerfile
      args:
        PHP_VERSION: "8.4"
        VITE_REVERB_APP_KEY: ${REVERB_APP_KEY:?Set REVERB_APP_KEY}
        VITE_REVERB_HOST: ${APP_DOMAIN:?Set APP_DOMAIN}
        VITE_REVERB_PORT: "443"
        VITE_REVERB_SCHEME: https
    restart: unless-stopped
    environment: *app-env
    volumes: *app-volumes
    networks: [internal]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/up >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    profiles: ["app"]

  app-green:
    image: ${APP_IMAGE_GREEN:-laravel-erp:uninitialized-green}
    build:
      context: ${APP_BUILD_CONTEXT:-/opt/laravel-erp/releases/uninitialized}
      dockerfile: /opt/laravel-erp/Dockerfile
      args:
        PHP_VERSION: "8.4"
        VITE_REVERB_APP_KEY: ${REVERB_APP_KEY:?Set REVERB_APP_KEY}
        VITE_REVERB_HOST: ${APP_DOMAIN:?Set APP_DOMAIN}
        VITE_REVERB_PORT: "443"
        VITE_REVERB_SCHEME: https
    restart: unless-stopped
    environment: *app-env
    volumes: *app-volumes
    networks: [internal]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/up >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    profiles: ["app"]

  horizon:
    image: ${APP_IMAGE_ACTIVE:-laravel-erp:uninitialized}
    build:
      context: ${APP_BUILD_CONTEXT:-/opt/laravel-erp/releases/uninitialized}
      dockerfile: /opt/laravel-erp/Dockerfile
      args:
        PHP_VERSION: "8.4"
        VITE_REVERB_APP_KEY: ${REVERB_APP_KEY:?Set REVERB_APP_KEY}
        VITE_REVERB_HOST: ${APP_DOMAIN:?Set APP_DOMAIN}
        VITE_REVERB_PORT: "443"
        VITE_REVERB_SCHEME: https
    command: ["php", "artisan", "horizon"]
    restart: unless-stopped
    environment: *app-env
    volumes: *app-volumes
    networks: [internal]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "php artisan horizon:status >/dev/null 2>&1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s

  reverb:
    image: ${APP_IMAGE_ACTIVE:-laravel-erp:uninitialized}
    build:
      context: ${APP_BUILD_CONTEXT:-/opt/laravel-erp/releases/uninitialized}
      dockerfile: /opt/laravel-erp/Dockerfile
      args:
        PHP_VERSION: "8.4"
        VITE_REVERB_APP_KEY: ${REVERB_APP_KEY:?Set REVERB_APP_KEY}
        VITE_REVERB_HOST: ${APP_DOMAIN:?Set APP_DOMAIN}
        VITE_REVERB_PORT: "443"
        VITE_REVERB_SCHEME: https
    command: ["php", "artisan", "reverb:start", "--host=0.0.0.0", "--port=8080"]
    restart: unless-stopped
    environment: *app-env
    volumes: *app-volumes
    networks: [internal]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "php artisan about >/dev/null 2>&1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s

  scheduler:
    image: ${APP_IMAGE_ACTIVE:-laravel-erp:uninitialized}
    build:
      context: ${APP_BUILD_CONTEXT:-/opt/laravel-erp/releases/uninitialized}
      dockerfile: /opt/laravel-erp/Dockerfile
      args:
        PHP_VERSION: "8.4"
        VITE_REVERB_APP_KEY: ${REVERB_APP_KEY:?Set REVERB_APP_KEY}
        VITE_REVERB_HOST: ${APP_DOMAIN:?Set APP_DOMAIN}
        VITE_REVERB_PORT: "443"
        VITE_REVERB_SCHEME: https
    command: ["php", "artisan", "schedule:work"]
    restart: unless-stopped
    environment: *app-env
    volumes: *app-volumes
    networks: [internal]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "php artisan about >/dev/null 2>&1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

  phpmyadmin:
    image: phpmyadmin:5.2-apache
    profiles: ["admin"]
    restart: unless-stopped
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_ABSOLUTE_URI: http://127.0.0.1:${PMA_BIND_PORT:-8081}/
      PMA_BLOWFISH_SECRET: ${PMA_BLOWFISH_SECRET:?Set PMA_BLOWFISH_SECRET}
      UPLOAD_LIMIT: 32M
    ports:
      - "127.0.0.1:${PMA_BIND_PORT:-8081}:80"
    networks: [internal]
    depends_on:
      db: {condition: service_healthy}
    security_opt: ["no-new-privileges:true"]

networks:
  edge: {}
  internal:
    internal: true

volumes:
  mariadb_data: {}
  redis_data: {}
  traefik_acme: {}
