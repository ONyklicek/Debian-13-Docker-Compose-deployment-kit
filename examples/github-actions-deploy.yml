# Vzor workflow pro aplikační repozitář: po push do main nasadí přesný commit přes SSH.
# Na serveru: uživatel "deploy" + /etc/sudoers.d/dkit-deploy:
#   deploy ALL=(root) NOPASSWD: /usr/local/bin/dkit deploy shop *
# Repository secrets: DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY, DEPLOY_KNOWN_HOSTS (ověřený host key).
# Před produkcí připněte akce na plné commit SHA podle firemní politiky.
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy přes dkit
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          APP: shop
        run: |
          install -m 0700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy && chmod 0600 ~/.ssh/id_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=yes "$USER@$HOST" \
            sudo /usr/local/bin/dkit deploy "$APP" --ref "$GITHUB_SHA"
