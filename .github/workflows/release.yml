name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test portable CLI
        run: go test ./...
      - name: Build portable CLI
        run: go build ./cmd/dkit

  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: ui/go.mod
      - name: Test web UI
        working-directory: ui
        run: go test ./...
      - name: Vet and build web UI
        working-directory: ui
        run: |
          go vet ./...
          go build -o /dev/null .

  build:
    needs: [test, ui]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            extension: ""
          - goos: linux
            goarch: arm64
            extension: ""
          - goos: darwin
            goarch: amd64
            extension: ""
          - goos: darwin
            goarch: arm64
            extension: ""
          - goos: windows
            goarch: amd64
            extension: .exe
          - goos: windows
            goarch: arm64
            extension: .exe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build and package portable CLI
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -eu
          version="${GITHUB_REF_NAME#v}"
          target="dkit-${GOOS}-${GOARCH}"
          binary="${target}${{ matrix.extension }}"
          mkdir -p dist
          CGO_ENABLED=0 go build -trimpath \
            -ldflags="-s -w -X main.version=${version}" \
            -o "dist/${binary}" ./cmd/dkit
          if [ "$GOOS" = windows ]; then
            (cd dist && zip -q "${target}.zip" "$binary")
          else
            tar -C dist -czf "dist/${target}.tar.gz" "$binary"
          fi
          rm "dist/${binary}"
      - uses: actions/upload-artifact@v4
        with:
          name: dkit-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/dkit-*
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create checksums
        working-directory: dist
        run: sha256sum dkit-* > SHA256SUMS
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" dist/dkit-* dist/SHA256SUMS \
            --title "$RELEASE_TAG" \
            --generate-notes \
            --verify-tag
